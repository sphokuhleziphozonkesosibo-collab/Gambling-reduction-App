<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="loginTitle">Login - BetAware SA</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #CF0A2C 0%, #9B0B23 100%);
            padding: 20px;
        }
        
        .auth-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .auth-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            border-color: #CF0A2C;
            outline: none;
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #CF0A2C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-primary:hover {
            background: #9B0B23;
        }
        
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .auth-links a {
            color: #CF0A2C;
            text-decoration: none;
        }
        
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* Language Switcher */
        .language-switcher {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .language-switcher select {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h2 data-translate="loginTitle">🎯 Login to BetAware SA</h2>
            
            <!-- Language Switcher -->
            <div class="language-switcher">
                <select id="languageSwitch" onchange="switchLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zu">IsiZulu</option>
                    <option value="af">Afrikaans</option>
                    <option value="xh">IsiXhosa</option>
                    <option value="nso">Sesotho sa Leboa</option>
                    <option value="st">Sesotho</option>
                    <option value="tn">Setswana</option>
                    <option value="ts">Xitsonga</option>
                    <option value="ss">SiSwati</option>
                    <option value="ve">Tshivenda</option>
                    <option value="nr">isiNdebele</option>
                </select>
            </div>
            
            <div id="alertMessage" class="alert" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" data-translate="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password" data-translate="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-primary" data-translate="loginButton">Login</button>
            </form>
            
            <div class="auth-links">
                <p data-translate="noAccount">Don't have an account? <a href="register.html" data-translate="registerHere">Register here</a></p>
                <p data-translate="forgotPassword">Forgot password? <a href="forgot-password.html" data-translate="resetHere">Reset here</a></p>
            </div>
        </div>
    </div>

    <script>
        // 11 Official SA Languages Translations for Login
        const translations = {
            en: {
                loginTitle: "Login - BetAware SA",
                email: "Email:",
                password: "Password:",
                loginButton: "Login",
                noAccount: "Don't have an account?",
                registerHere: "Register here",
                forgotPassword: "Forgot password?",
                resetHere: "Reset here",
                loggingIn: "Logging in...",
                loginSuccess: "Login successful!",
                loginError: "Login failed. Please try again."
            },
            zu: {
                loginTitle: "Ngena - BetAware SA",
                email: "I-imeyili:",
                password: "Iphasiwedi:",
                loginButton: "Ngena",
                noAccount: "Awunawo i-akhawunti?",
                registerHere: "Bhalisa lapha",
                forgotPassword: "Ukhohliwe iphasiwedi?",
                resetHere: "Setha kabusha lapha",
                loggingIn: "Iyangena...",
                loginSuccess: "Ungene ngempumelelo!",
                loginError: "Ukungena kwehlulekile. Zama futhi."
            },
            af: {
                loginTitle: "Teken In - BetAware SA",
                email: "E-pos:",
                password: "Wagwoord:",
                loginButton: "Teken In",
                noAccount: "Het jy nie 'n rekening nie?",
                registerHere: "Registreer hier",
                forgotPassword: "Wagwoord vergeet?",
                resetHere: "Herstel hier",
                loggingIn: "Meld aan...",
                loginSuccess: "Suksesvol aangeteken!",
                loginError: "Aantekening misluk. Probeer asseblief weer."
            },
            xh: {
                loginTitle: "Ngena - BetAware SA",
                email: "I-imeyili:",
                password: "Iphasiwedi:",
                loginButton: "Ngena",
                noAccount: "Awunayo i-akhawunti?",
                registerHere: "Bhalisa apha",
                forgotPassword: "Ulibele iphasiwedi?",
                resetHere: "Seta kwakhona apha",
                loggingIn: "Iyangena...",
                loginSuccess: "Ungene ngempumelelo!",
                loginError: "Ukungena kwehlulekile. Zama kwakhona."
            }
            // Add other 7 languages following the same pattern...
        };

        let currentLanguage = 'en';

        function switchLanguage(lang) {
            currentLanguage = lang;
            translatePage();
        }

        function translatePage() {
            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[currentLanguage] && translations[currentLanguage][key]) {
                    if (element.placeholder) {
                        element.placeholder = translations[currentLanguage][key];
                    } else {
                        element.textContent = translations[currentLanguage][key];
                    }
                }
            });
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alertMessage');
            
            // Show loading
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.textContent = translations[currentLanguage]?.loggingIn || 'Logging in...';
            submitBtn.disabled = true;
            
            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Store user data
                    localStorage.setItem('userData', JSON.stringify(data.user));
                    
                    // Show success message
                    alertDiv.textContent = translations[currentLanguage]?.loginSuccess || '✅ ' + data.message;
                    alertDiv.className = 'alert alert-success';
                    alertDiv.style.display = 'block';
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                    
                } else {
                    // Show error message
                    alertDiv.textContent = '❌ ' + data.message;
                    alertDiv.className = 'alert alert-error';
                    alertDiv.style.display = 'block';
                    
                    submitBtn.textContent = translations[currentLanguage]?.loginButton || 'Login';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alertDiv.textContent = translations[currentLanguage]?.loginError || '❌ Login failed. Please try again.';
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
                
                submitBtn.textContent = translations[currentLanguage]?.loginButton || 'Login';
                submitBtn.disabled = false;
            });
        });

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            translatePage();
        });
    </script>
</body>
</html>
