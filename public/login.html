<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="loginTitle">Login - BetAware SA</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h2 data-translate="loginTitle">🎯 Welcome back</h2>
            <p class="subtitle">Log in to keep your betting budget on track</p>

            <div class="language-switcher">
                <select id="languageSwitch" onchange="switchLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zu">IsiZulu</option>
                    <option value="af">Afrikaans</option>
                    <option value="xh">IsiXhosa</option>
                    <option value="nso">Sesotho sa Leboa</option>
                    <option value="st">Sesotho</option>
                    <option value="tn">Setswana</option>
                    <option value="ts">Xitsonga</option>
                    <option value="ss">SiSwati</option>
                    <option value="ve">Tshivenda</option>
                    <option value="nr">isiNdebele</option>
                </select>
            </div>

            <div id="alertMessage" class="alert" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" data-translate="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password" data-translate="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary" data-translate="loginButton">Login</button>
            </form>

            <div class="auth-links">
              <p data-translate="noAccount">Don't have an account?</p>
              <button type="button" onclick="window.location.href='register.html'">
                  Register
              </button>
              <p style="margin-top: 10px;"><a href="forgot-password.html" style="color: var(--dawn-amber-dark); font-size: 0.85rem;" data-translate="forgotPassword">Forgot password?</a></p>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                loginTitle: "Login - BetAware SA", email: "Email:", password: "Password:",
                loginButton: "Login", noAccount: "Don't have an account?", registerHere: "Register here",
                forgotPassword: "Forgot password?", resetHere: "Reset here", loggingIn: "Logging in...",
                loginSuccess: "Login successful!", loginError: "Login failed. Please try again."
            },
            zu: {
                loginTitle: "Ngena - BetAware SA", email: "I-imeyili:", password: "Iphasiwedi:",
                loginButton: "Ngena", noAccount: "Awunawo i-akhawunti?", registerHere: "Bhalisa lapha",
                forgotPassword: "Ukhohliwe iphasiwedi?", resetHere: "Setha kabusha lapha", loggingIn: "Iyangena...",
                loginSuccess: "Ungene ngempumelelo!", loginError: "Ukungena kwehlulekile. Zama futhi."
            },
            af: {
                loginTitle: "Teken In - BetAware SA", email: "E-pos:", password: "Wagwoord:",
                loginButton: "Teken In", noAccount: "Het jy nie 'n rekening nie?", registerHere: "Registreer hier",
                forgotPassword: "Wagwoord vergeet?", resetHere: "Herstel hier", loggingIn: "Meld aan...",
                loginSuccess: "Suksesvol aangeteken!", loginError: "Aantekening misluk. Probeer asseblief weer."
            },
            xh: {
                loginTitle: "Ngena - BetAware SA", email: "I-imeyili:", password: "Iphasiwedi:",
                loginButton: "Ngena", noAccount: "Awunayo i-akhawunti?", registerHere: "Bhalisa apha",
                forgotPassword: "Ulibele iphasiwedi?", resetHere: "Seta kwakhona apha", loggingIn: "Iyangena...",
                loginSuccess: "Ungene ngempumelelo!", loginError: "Ukungena kwehlulekile. Zama kwakhona."
            },
            nso: {
                loginTitle: "Tsena - BetAware SA", email: "Imeile:", password: "Phasewete:",
                loginButton: "Tsena", noAccount: "Ga o na akhaonto?", registerHere: "Ngwadiša mo",
                forgotPassword: "O lebetše phasewete?", resetHere: "Beakanya mo", loggingIn: "E a tsena...",
                loginSuccess: "O tsene ka katlego!", loginError: "Go tsena go paletše. Leka gape."
            },
            st: {
                loginTitle: "Kena - BetAware SA", email: "Imeile:", password: "Phasewete:",
                loginButton: "Kena", noAccount: "Ha o na akhaonto?", registerHere: "Ngodisa mona",
                forgotPassword: "O lebetse phasewete?", resetHere: "Beha bocha mona", loggingIn: "E kena...",
                loginSuccess: "O kene ka katleho!", loginError: "Ho kena ho hlolehile. Leka hape."
            },
            tn: {
                loginTitle: "Tsena - BetAware SA", email: "Imeile:", password: "Phasewete:",
                loginButton: "Tsena", noAccount: "Ga o na akhaonto?", registerHere: "Ngodisa fano",
                forgotPassword: "O lebetse phasewete?", resetHere: "Baakanya sesha fano", loggingIn: "E tsena...",
                loginSuccess: "O tsene ka katlego!", loginError: "Go tsena go paletswe. Leka gape."
            },
            ts: {
                loginTitle: "Ngena - BetAware SA", email: "Imeyili:", password: "Phaseward:",
                loginButton: "Ngena", noAccount: "Xana a wu na akhawunti?", registerHere: "Tsarisa laha",
                forgotPassword: "U rivele phaseward?", resetHere: "Vulavula ntshha laha", loggingIn: "Yi nghena...",
                loginSuccess: "U ngheniwe hi ku humelela!", loginError: "Ku ngena ku tsandzekile. Ringeta nakambe."
            },
            ss: {
                loginTitle: "Ngena - BetAware SA", email: "I-imeyili:", password: "Liphasiwedi:",
                loginButton: "Ngena", noAccount: "Awunayo i-akhawunti?", registerHere: "Bhalisa lapha",
                forgotPassword: "Ukhohlwe liphasiwedi?", resetHere: "Setha kabusha lapha", loggingIn: "Iyangena...",
                loginSuccess: "Ungene ngempumelelo!", loginError: "Kungena kwehlulekile. Zama futsi."
            },
            ve: {
                loginTitle: "Dzhena - BetAware SA", email: "Iimeili:", password: "Phasiwede:",
                loginButton: "Dzhena", noAccount: "A u na akhaunthi?", registerHere: "Ṅwalisa hafha",
                forgotPassword: "Wo hangwa phasiwede?", resetHere: "Vhea hafhu hafha", loggingIn: "Khou dzhena...",
                loginSuccess: "Wo dzhena nga mvelaphanḓa!", loginError: "U dzhena ho kundeleka. Lingedza hafhu."
            },
            nr: {
                loginTitle: "Ngena - BetAware SA", email: "I-imeyili:", password: "Iphasiwedi:",
                loginButton: "Ngena", noAccount: "Awunayo i-akhawunti?", registerHere: "Bhalisa lapha",
                forgotPassword: "Ukhohliwe yiphasiwedi?", resetHere: "Beka kabutjha lapha", loggingIn: "Iyangena...",
                loginSuccess: "Ungenile ngokuphumelela!", loginError: "Ukungena kwehlulekile. Zama godu."
            }
        };

        let currentLanguage = 'en';

        function switchLanguage(lang) {
            currentLanguage = lang;
            translatePage();
        }

        function translatePage() {
            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[currentLanguage] && translations[currentLanguage][key]) {
                    if (element.placeholder) {
                        element.placeholder = translations[currentLanguage][key];
                    } else {
                        element.textContent = translations[currentLanguage][key];
                    }
                }
            });
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alertMessage');

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.textContent = translations[currentLanguage]?.loggingIn || 'Logging in...';
            submitBtn.disabled = true;

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('userData', JSON.stringify(data.user));

                    alertDiv.textContent = translations[currentLanguage]?.loginSuccess || '✅ ' + data.message;
                    alertDiv.className = 'alert alert-success';
                    alertDiv.style.display = 'block';

                    setTimeout(() => {
                        if (data.needs_pgsi) {
                            window.location.href = '/pgsi-assessment';
                        } else {
                            window.location.href = '/dashboard';
                        }
                    }, 800);

                } else if (data.needs_verification) {
                    alertDiv.innerHTML = '❌ ' + data.message + '<br><button type="button" id="resendBtn" style="margin-top:8px;background:none;border:none;color:#E8863C;font-weight:bold;text-decoration:underline;cursor:pointer;">Resend verification email</button>';
                    alertDiv.className = 'alert alert-error';
                    alertDiv.style.display = 'block';

                    document.getElementById('resendBtn').addEventListener('click', function() {
                        fetch('/api/resend-verification', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: data.email })
                        })
                        .then(r => r.json())
                        .then(d => {
                            alertDiv.textContent = '✅ ' + d.message;
                            alertDiv.className = 'alert alert-success';
                        });
                    });

                    submitBtn.textContent = translations[currentLanguage]?.loginButton || 'Login';
                    submitBtn.disabled = false;
                } else {
                    alertDiv.textContent = '❌ ' + data.message;
                    alertDiv.className = 'alert alert-error';
                    alertDiv.style.display = 'block';

                    submitBtn.textContent = translations[currentLanguage]?.loginButton || 'Login';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alertDiv.textContent = translations[currentLanguage]?.loginError || '❌ Login failed. Please try again.';
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';

                submitBtn.textContent = translations[currentLanguage]?.loginButton || 'Login';
                submitBtn.disabled = false;
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            translatePage();
        });
    </script>
</body>
</html>
