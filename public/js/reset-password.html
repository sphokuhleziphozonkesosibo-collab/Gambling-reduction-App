<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BetAware SA</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h2>🔑 Set a new password</h2>
            <p class="subtitle">Choose a new password for your account</p>

            <div id="alertMessage" class="alert" style="display: none;"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password (min 6 characters):</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">Reset Password</button>
            </form>

            <div class="auth-links">
                <button type="button" onclick="window.location.href='login.html'">Back to Login</button>
            </div>
        </div>
    </div>

    <script>
        // Pull the reset token out of the URL, e.g. /reset-password?token=abc123
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('alertMessage').textContent = '❌ Invalid or missing reset link. Please request a new one.';
            document.getElementById('alertMessage').className = 'alert alert-error';
            document.getElementById('alertMessage').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertDiv = document.getElementById('alertMessage');
            const submitBtn = document.getElementById('submitBtn');

            if (newPassword !== confirmPassword) {
                alertDiv.textContent = '❌ Passwords do not match.';
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (data.success) {
                    alertDiv.textContent = '✅ ' + data.message;
                    alertDiv.className = 'alert alert-success';
                    alertDiv.style.display = 'block';
                    document.getElementById('resetForm').style.display = 'none';

                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    alertDiv.textContent = '❌ ' + data.message;
                    alertDiv.className = 'alert alert-error';
                    alertDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (err) {
                alertDiv.textContent = '❌ Something went wrong. Please try again.';
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
