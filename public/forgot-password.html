<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BetAware SA</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h2>🔑 Reset your password</h2>
            <p class="subtitle">Enter your email and we'll send you a reset link</p>

            <div id="alertMessage" class="alert" style="display: none;"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link</button>
            </form>

            <div class="auth-links">
                <p>Remembered your password?</p>
                <button type="button" onclick="window.location.href='login.html'">Back to Login</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const alertDiv = document.getElementById('alertMessage');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                // Always shown as success — we never reveal whether an
                // email exists, that's a security best practice
                alertDiv.textContent = '✅ ' + data.message;
                alertDiv.className = 'alert alert-success';
                alertDiv.style.display = 'block';
                document.getElementById('forgotForm').reset();

            } catch (err) {
                alertDiv.textContent = '❌ Something went wrong. Please try again.';
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
